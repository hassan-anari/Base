[package]
name = "wallet-mpc-protocol"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
rand_core.workspace = true
cggmp24.workspace = true
cggmp24-keygen.workspace = true
frost-ed25519.workspace = true
anyhow.workspace = true
bs58 = "=0.5.1"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
sha3 = "=0.10.8"

# TON cells are local to synchronous verification; upstream Rc cells never cross
# an await/thread boundary. Keep sync disabled to exclude the scc dependency.
everscale-types = { version = "=0.1.2", default-features = false }

[dev-dependencies]
round-based = { version = "=0.4.1", features = ["sim"] }
