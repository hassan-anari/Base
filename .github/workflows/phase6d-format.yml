name: Phase 6D formatting recovery
on: pull_request
permissions: {contents: read}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0, components: rustfmt}
      - run: cargo fmt --all --manifest-path mpc-side/Cargo.toml
      - run: pip install ruff==0.14.0
      - run: ruff format mpc-side/integration/test_cggmp_aux.py
      - run: git diff --no-color --binary
      - run: ruff check mpc-side/integration/test_cggmp_aux.py
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side}
      - run: cargo check --manifest-path mpc-side/Cargo.toml --workspace --all-targets
      - run: cargo clippy --manifest-path mpc-side/Cargo.toml --workspace --all-targets -- -D warnings
      - if: always()
        run: git diff --no-color --binary mpc-side/Cargo.lock
