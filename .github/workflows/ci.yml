name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallet_mpc
          POSTGRES_USER: wallet_mpc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet_mpc -d wallet_mpc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend-side
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      MPC_SIGNER_BACKEND: local_key
      CUSTODY_DEMO_MODE: "true"
      CUSTODY_TX_MODE: stub
      LOCAL_KEY_ENCRYPTION_PASSPHRASE: ci-only-local-signer-passphrase
      CUSTODY_INDEXER_MODE: stub
      DATABASE_URL: postgresql://wallet_mpc:ci-only-password@127.0.0.1:5432/wallet_mpc
      POSTGRES_DB: wallet_mpc
      POSTGRES_USER: wallet_mpc
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-side/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: ruff format --check custody/checks.py custody/mpc_payload.py custody/mpc_identity.py custody/mpc_signing.py custody/management/commands/mpc_keyset.py custody/management/commands/advance_mpc_signing.py custody/management/commands/bind_mpc_hot_wallet.py custody/migrations/001[2-9]* custody/tests
      - run: ruff check custody/checks.py custody/mpc_payload.py custody/mpc_identity.py custody/mpc_signing.py custody/management/commands/mpc_keyset.py custody/management/commands/advance_mpc_signing.py custody/management/commands/bind_mpc_hot_wallet.py custody/migrations/001[2-9]* custody/tests
      - run: >-
          ruff format --check custody/admin.py custody/api.py custody/apps.py
          custody/config.py custody/deposits.py custody/gas_station.py custody/indexer_service.py
          custody/ledger.py custody/models.py custody/mpc_signer.py custody/schemas.py
          custody/sweeper.py custody/withdrawals.py custody/tests
          custody/migrations/0004_reconciliation_and_gas_intents.py
          custody/migrations/0005_ledgertransaction_ledgeraccount_ledgerposting.py
          custody/migrations/0006_ledgeraccount_ledger_account_valid_shape.py
          custody/chain_registry.py custody/chain_adapters.py custody/chain_status.py
          custody/indexer custody/hd_wallet.py custody/signer_adapter.py custody/native_tx.py
          custody/outbound.py custody/reconciliation.py
          custody/token_metadata.py custody/token_tx.py custody/spl.py
          custody/management/commands/verify_token_asset.py
          custody/management/commands/advance_pending_sweeps.py
          custody/migrations/0010_phase5_token_custody.py
          custody/migrations/0011_sweep_processing_claim.py
          custody/management/commands/reconcile_outbound.py
          custody/migrations/0008_native_transaction_lifecycle.py
          custody/migrations/0009_disable_ton_outbound.py
          ops/services.py ops/models.py ops/migrations/0004_normalize_chain_kinds.py
          custody/migrations/0007_disable_ton_deposits.py

      - run: >-
          ruff check custody/admin.py custody/api.py custody/apps.py
          custody/config.py custody/deposits.py custody/gas_station.py custody/indexer_service.py
          custody/ledger.py custody/models.py custody/mpc_signer.py custody/schemas.py
          custody/sweeper.py custody/withdrawals.py custody/tests
          custody/migrations/0004_reconciliation_and_gas_intents.py
          custody/migrations/0005_ledgertransaction_ledgeraccount_ledgerposting.py
          custody/migrations/0006_ledgeraccount_ledger_account_valid_shape.py
          custody/chain_registry.py custody/chain_adapters.py custody/chain_status.py
          custody/indexer custody/hd_wallet.py custody/signer_adapter.py custody/native_tx.py
          custody/outbound.py custody/reconciliation.py
          custody/token_metadata.py custody/token_tx.py custody/spl.py
          custody/management/commands/verify_token_asset.py
          custody/management/commands/advance_pending_sweeps.py
          custody/migrations/0010_phase5_token_custody.py
          custody/migrations/0011_sweep_processing_claim.py
          custody/management/commands/reconcile_outbound.py
          custody/migrations/0008_native_transaction_lifecycle.py
          custody/migrations/0009_disable_ton_outbound.py
          ops/services.py ops/models.py ops/migrations/0004_normalize_chain_kinds.py
          custody/migrations/0007_disable_ton_deposits.py

  rust-check:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mpc-side}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0, components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --skip cggmp_real_two_of_three_all_signer_pairs

  rust-crypto:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mpc-side}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side}
      - run: cargo test --locked -p wallet-mpc-protocol

  rust-audit:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mpc-side}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: cargo-audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.0-stable
      - if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.0 --locked
      - run: cargo audit


  mpc-network:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-transport-only
      MPC_SIGNER_BACKEND: local_key
      CUSTODY_DEMO_MODE: "true"
      CUSTODY_TX_MODE: stub
      CUSTODY_INDEXER_MODE: stub
      LOCAL_KEY_ENCRYPTION_PASSPHRASE: ci-transport-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-side/requirements.txt
      - run: pip install -r backend-side/requirements.txt
      - run: cargo build --locked --manifest-path mpc-side/Cargo.toml --bin wallet-mpc-coordinator --bin wallet-mpc-signer --example frost_round1_fixture
      - run: pytest -v mpc-side/integration/test_network.py mpc-side/integration/test_dkg.py
      - run: ruff format --check backend-side/custody/mpc_transport.py mpc-side/integration
      - run: ruff check backend-side/custody/mpc_transport.py mpc-side/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-side
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-side/package-lock.json
      - run: npm ci
      - run: npm run test:contract
      - run: npm run build
      - run: npm run build:sim
