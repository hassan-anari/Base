name: CI
run-name: CI ${{ github.event.pull_request.head.sha || github.sha }} (${{ github.event_name }} / ${{ github.event.action || 'run' }})

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full_crypto:
        description: Run the full CGGMP/FROST recovery and EVM/TRON/Solana/TON custody acceptance gate
        type: boolean
        default: true
      crypto_suite:
        description: Select one suite for debugging; only all can satisfy the full gate
        type: choice
        options: [all, evm, tron, solana, ton, integrated, aux-persistence, network, protocol]
        default: all
  schedule:
    - cron: '0 3 * * 0'

env:
  REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallet_mpc
          POSTGRES_USER: wallet_mpc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet_mpc -d wallet_mpc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend-side
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      MPC_SIGNER_BACKEND: local_key
      CUSTODY_DEMO_MODE: "true"
      CUSTODY_TX_MODE: stub
      LOCAL_KEY_ENCRYPTION_PASSPHRASE: ci-only-local-signer-passphrase
      CUSTODY_INDEXER_MODE: stub
      DATABASE_URL: postgresql://wallet_mpc:ci-only-password@127.0.0.1:5432/wallet_mpc
      POSTGRES_DB: wallet_mpc
      POSTGRES_USER: wallet_mpc
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: %s\n' "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-side/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: ruff format --check custody/mpc_provisioning.py custody/migrations/002[7-8]*
      - run: ruff check custody/mpc_provisioning.py custody/migrations/002[7-8]*
      - run: ruff format --check custody/checks.py custody/mpc_payload.py custody/mpc_identity.py custody/mpc_binding.py custody/mpc_evm_network.py custody/mpc_tron_network.py custody/mpc_solana_network.py custody/mpc_ton_network.py custody/ton*.py custody/account_chain_costs.py custody/management/commands/ton_wallet_binding.py custody/solana_wire.py custody/solana_policy.py custody/solana_settlement.py custody/solana_deposits.py custody/solana_costs.py custody/tron_wire.py custody/tron_policy.py custody/tron_settlement.py custody/mpc_signing.py custody/management/commands/mpc_keyset.py custody/management/commands/advance_mpc_signing.py custody/management/commands/bind_mpc_hot_wallet.py custody/migrations/001[2-9]* custody/migrations/002[0-6]* custody/tests
      - run: ruff check custody/checks.py custody/mpc_payload.py custody/mpc_identity.py custody/mpc_binding.py custody/mpc_evm_network.py custody/mpc_tron_network.py custody/mpc_solana_network.py custody/mpc_ton_network.py custody/ton*.py custody/account_chain_costs.py custody/management/commands/ton_wallet_binding.py custody/solana_wire.py custody/solana_policy.py custody/solana_settlement.py custody/solana_deposits.py custody/solana_costs.py custody/tron_wire.py custody/tron_policy.py custody/tron_settlement.py custody/mpc_signing.py custody/management/commands/mpc_keyset.py custody/management/commands/advance_mpc_signing.py custody/management/commands/bind_mpc_hot_wallet.py custody/migrations/001[2-9]* custody/migrations/002[0-6]* custody/tests
      - run: >-
          ruff format --check custody/admin.py custody/api.py custody/apps.py
          custody/config.py custody/deposits.py custody/gas_station.py custody/indexer_service.py
          custody/ledger.py custody/models.py custody/mpc_signer.py custody/schemas.py
          custody/sweeper.py custody/withdrawals.py custody/tests
          custody/migrations/0004_reconciliation_and_gas_intents.py
          custody/migrations/0005_ledgertransaction_ledgeraccount_ledgerposting.py
          custody/migrations/0006_ledgeraccount_ledger_account_valid_shape.py
          custody/chain_registry.py custody/chain_adapters.py custody/chain_status.py
          custody/indexer custody/hd_wallet.py custody/signer_adapter.py custody/native_tx.py
          custody/outbound.py custody/reconciliation.py
          custody/token_metadata.py custody/token_tx.py custody/spl.py
          custody/management/commands/verify_token_asset.py
          custody/management/commands/advance_pending_sweeps.py
          custody/migrations/0010_phase5_token_custody.py
          custody/migrations/0011_sweep_processing_claim.py
          custody/management/commands/reconcile_outbound.py
          custody/migrations/0008_native_transaction_lifecycle.py
          custody/migrations/0009_disable_ton_outbound.py
          ops/services.py ops/models.py ops/migrations/0004_normalize_chain_kinds.py
          custody/migrations/0007_disable_ton_deposits.py

      - run: >-
          ruff check custody/admin.py custody/api.py custody/apps.py
          custody/config.py custody/deposits.py custody/gas_station.py custody/indexer_service.py
          custody/ledger.py custody/models.py custody/mpc_signer.py custody/schemas.py
          custody/sweeper.py custody/withdrawals.py custody/tests
          custody/migrations/0004_reconciliation_and_gas_intents.py
          custody/migrations/0005_ledgertransaction_ledgeraccount_ledgerposting.py
          custody/migrations/0006_ledgeraccount_ledger_account_valid_shape.py
          custody/chain_registry.py custody/chain_adapters.py custody/chain_status.py
          custody/indexer custody/hd_wallet.py custody/signer_adapter.py custody/native_tx.py
          custody/outbound.py custody/reconciliation.py
          custody/token_metadata.py custody/token_tx.py custody/spl.py
          custody/management/commands/verify_token_asset.py
          custody/management/commands/advance_pending_sweeps.py
          custody/migrations/0010_phase5_token_custody.py
          custody/migrations/0011_sweep_processing_claim.py
          custody/management/commands/reconcile_outbound.py
          custody/migrations/0008_native_transaction_lifecycle.py
          custody/migrations/0009_disable_ton_outbound.py
          ops/services.py ops/models.py ops/migrations/0004_normalize_chain_kinds.py
          custody/migrations/0007_disable_ton_deposits.py

  rust-check:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mpc-side}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: %s\n' "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0, components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --skip cggmp_real_two_of_three_all_signer_pairs

  rust-crypto:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'protocol')
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mpc-side}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: %s\n' "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side}
      - run: cargo test --locked -p wallet-mpc-protocol

  rust-audit:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mpc-side}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: %s\n' "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: cargo-audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.0-stable
      - if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.0 --locked
      - run: cargo audit


  crypto-preflight:
    if: (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)
    needs: [backend, rust-check, rust-audit, frontend]
    outputs:
      suites: ${{ steps.selection.outputs.suites }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallet_mpc
          POSTGRES_USER: wallet_mpc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet_mpc -d wallet_mpc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://wallet_mpc:ci-only-password@127.0.0.1:5432/wallet_mpc
      POSTGRES_DB: wallet_mpc
      POSTGRES_USER: wallet_mpc
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      DJANGO_SECRET_KEY: ci-transport-only
      MPC_SIGNER_BACKEND: local_key
      CUSTODY_DEMO_MODE: "true"
      CUSTODY_TX_MODE: stub
      CUSTODY_INDEXER_MODE: stub
      LOCAL_KEY_ENCRYPTION_PASSPHRASE: ci-transport-only
      PHASE6F_TRON_JAR: /tmp/phase6f-FullNode.jar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: %s\n' "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side, shared-key: mpc-network}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-side/requirements.txt
      - run: pip install -r backend-side/requirements.txt
      - run: ruff format --check backend-side/custody/mpc_transport.py mpc-side/integration
      - run: ruff check backend-side/custody/mpc_transport.py mpc-side/integration
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mpc-side/integration/evm/package-lock.json
      - run: npm ci --prefix mpc-side/integration/evm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Cache public pinned java-tron release
        uses: actions/cache@v4
        with:
          path: /tmp/phase6f-FullNode.jar
          key: java-tron-4.8.2.3-faef7f4d89b9f154632bbab2db1712c25f02ee37b356013e098558ea994accec
      - name: Fetch and verify pinned disposable java-tron validator
        run: |
          if [ ! -f "$PHASE6F_TRON_JAR" ]; then
            curl --fail --location --silent --show-error https://github.com/tronprotocol/java-tron/releases/download/GreatVoyage-v4.8.2.3/FullNode.jar -o "$PHASE6F_TRON_JAR"
          fi
          echo "faef7f4d89b9f154632bbab2db1712c25f02ee37b356013e098558ea994accec  $PHASE6F_TRON_JAR" | sha256sum --check
      - run: cargo build --locked --manifest-path mpc-side/Cargo.toml --bin wallet-mpc-coordinator --bin wallet-mpc-signer --example frost_round1_fixture --example frost_signing_package --example cggmp_round1_fixture --example cggmp_aux_message_fixture
      - name: Verify complete crypto inventory without executing fixtures
        run: |
          mkdir -p work
          pytest --collect-only -q mpc-side/integration/test_cggmp.py mpc-side/integration/test_cggmp_aux.py mpc-side/integration/test_network.py mpc-side/integration/test_dkg.py mpc-side/integration/test_signing.py mpc-side/integration/test_solana.py mpc-side/integration/test_ton.py mpc-side/integration/test_ton_network.py mpc-side/integration/test_ton_django.py mpc-side/integration/test_integrated.py --crypto-suite=all --crypto-manifest=work/crypto-inventory.json
      - name: Verify real TLS and disposable validator setup before fresh primes
        run: pytest -x -v -s mpc-side/integration/test_ci_preflight.py --basetemp=work/preflight --junitxml=work/crypto-preflight.xml --durations=0
      - name: Select isolated crypto jobs
        id: selection
        env:
          REQUESTED_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.crypto_suite || 'all' }}
        run: |
          python - <<'PYCODE'
          import json, os
          suites = ['evm', 'tron', 'solana', 'ton', 'aux-persistence', 'network', 'integrated']
          requested = os.environ['REQUESTED_SUITE']
          if requested == 'protocol':
              suites = []
          elif requested != 'all':
              if requested not in suites:
                  raise SystemExit('Unknown crypto suite')
              suites = [requested]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('suites=' + json.dumps(suites) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-preflight-public-results
          retention-days: 7
          path: |
            work/crypto-inventory.json
            work/crypto-preflight.xml

  mpc-evm:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'evm')
    uses: ./.github/workflows/crypto-suite.yml
    with:
      suite: evm
      reviewed_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mpc-tron:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'tron')
    uses: ./.github/workflows/crypto-suite.yml
    with:
      suite: tron
      reviewed_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mpc-solana:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'solana')
    uses: ./.github/workflows/crypto-suite.yml
    with:
      suite: solana
      reviewed_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mpc-ton:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'ton')
    uses: ./.github/workflows/crypto-suite.yml
    with:
      suite: ton
      reviewed_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mpc-integrated:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'integrated')
    uses: ./.github/workflows/crypto-suite.yml
    with:
      suite: integrated
      reviewed_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mpc-aux-persistence:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'aux-persistence')
    uses: ./.github/workflows/crypto-suite.yml
    with:
      suite: aux-persistence
      reviewed_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mpc-network:
    needs: [crypto-preflight]
    if: ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all' || inputs.crypto_suite == 'network')
    uses: ./.github/workflows/crypto-suite.yml
    with:
      suite: network
      reviewed_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-side
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: %s\n' "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-side/package-lock.json
      - run: npm ci
      - name: Verify Linux EVM acceptance dependencies and token compilation
        run: |
          npm ci --prefix ../mpc-side/integration/evm
          node ../mpc-side/integration/evm/compile.cjs "$RUNNER_TEMP/phase6e-token-bytecode"
          node ../mpc-side/integration/tron/compile.cjs "$RUNNER_TEMP/phase6f-token-tvm"
      - run: npm run test:contract
      - run: npm run build
      - run: npm run build:sim

  full-crypto-gate:
    needs: [backend, rust-check, rust-audit, frontend, crypto-preflight, rust-crypto, mpc-evm, mpc-tron, mpc-solana, mpc-ton, mpc-integrated, mpc-aux-persistence, mpc-network]
    if: always() && ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-crypto') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_crypto)) && (github.event_name != 'workflow_dispatch' || inputs.crypto_suite == 'all')
    runs-on: ubuntu-latest
    env:
      REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Require success from every fast, preflight and full crypto job
        run: |
          python - <<'PYCODE'
          import json, os
          required = {'backend', 'rust-check', 'rust-audit', 'frontend', 'crypto-preflight', 'rust-crypto', 'mpc-evm', 'mpc-tron', 'mpc-solana', 'mpc-ton', 'mpc-integrated', 'mpc-aux-persistence', 'mpc-network'}
          results = json.loads(os.environ['REQUIRED_RESULTS'])
          assert set(results) == required
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          assert all(job['result'] == 'success' for job in results.values()), 'Failed, cancelled or skipped required job'
          assert json.loads(results['crypto-preflight']['outputs']['suites']) == ['evm', 'tron', 'solana', 'ton', 'aux-persistence', 'network', 'integrated']
          PYCODE
