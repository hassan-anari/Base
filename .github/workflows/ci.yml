name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallet_mpc
          POSTGRES_USER: wallet_mpc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet_mpc -d wallet_mpc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend-side
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      MPC_SIGNER_BACKEND: local_key
      CUSTODY_DEMO_MODE: "true"
      LOCAL_KEY_ENCRYPTION_PASSPHRASE: ci-only-local-signer-passphrase
      CUSTODY_INDEXER_MODE: stub
      DATABASE_URL: postgresql://wallet_mpc:ci-only-password@127.0.0.1:5432/wallet_mpc
      POSTGRES_DB: wallet_mpc
      POSTGRES_USER: wallet_mpc
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-side/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: >-
          ruff format --check custody/admin.py custody/api.py custody/apps.py
          custody/config.py custody/deposits.py custody/gas_station.py custody/indexer_service.py
          custody/ledger.py custody/models.py custody/mpc_signer.py custody/schemas.py
          custody/sweeper.py custody/withdrawals.py custody/tests
          custody/migrations/0004_reconciliation_and_gas_intents.py
          custody/migrations/0005_ledgertransaction_ledgeraccount_ledgerposting.py
      - run: >-
          ruff check custody/admin.py custody/api.py custody/apps.py
          custody/config.py custody/deposits.py custody/gas_station.py custody/indexer_service.py
          custody/ledger.py custody/models.py custody/mpc_signer.py custody/schemas.py
          custody/sweeper.py custody/withdrawals.py custody/tests
          custody/migrations/0004_reconciliation_and_gas_intents.py
          custody/migrations/0005_ledgertransaction_ledgeraccount_ledgerposting.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-side
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-side/package-lock.json
      - run: npm ci
      - run: npm run test:contract
      - run: npm run build
      - run: npm run build:sim
